# Track B local stores — Qdrant + Neo4j, development only.
# Credentials come from the environment (NEO4J_PASSWORD), never committed.
# Volumes live under data/ (gitignored at M0). `docker compose` here, not at
# repo root: Track B is self-contained until M6 promotes it.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["../data/qdrant:/qdrant/storage"]

  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is not set}"
    volumes: ["../data/neo4j:/data"]
